[project]
name = "kavach-sombrero"
version = "0.1.0"
description = "Kavach API and agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-adk>=1.0",
  "google-genai>=1.0",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.17",
  "google-cloud-discoveryengine>=0.12",
  "google-cloud-bigquery>=3.25",
  "firebase-admin>=6.5",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI Depends() in defaults is the normal pattern.
ignore = ["B008", "FAST002"]
