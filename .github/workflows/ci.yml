name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sombrero
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: sombrero/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest tests/

  frontend:
    name: Frontend (oxlint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andromeda/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: andromeda/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build