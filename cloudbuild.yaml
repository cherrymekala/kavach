# Push to main -> build sombrero -> deploy to Cloud Run.
substitutions:
  _REGION: asia-south1
  _SERVICE: sombrero
  _REPO: kavach
  _MODEL_FAST: gemini-3.5-flash-lite
  _MODEL_REASONING: gemini-3.8-flash
  _PUBLIC_URL: https://sombrero-urb5ttky3q-el.a.run.app
  # Set to true (trigger substitution) to charge for the appeal pack; false = everything free.
  _PAYMENTS_ENABLED: "false"
  # WhatsApp: the webhook URL is ${_PUBLIC_URL}/whatsapp/webhook. Paste _WHATSAPP_VERIFY_TOKEN
  # into Meta's webhook setup. An empty substitution reaches the container as an empty env var,
  # which the app reads as "not configured", so a channel can stay dark without breaking deploy.
  _WHATSAPP_VERIFY_TOKEN: kavach-verify
  _WHATSAPP_PHONE_NUMBER_ID: ""
  _WHATSAPP_TEMPLATE: ""
  # Email (Cloudflare Email Service): reimaginy.tech is onboarded for sending; replies to
  # _MAIL_REPLY_TO are routed to the pinwheel/ Worker. No sending token (or the "unset" placeholder) = dry run.
  _MAIL_FROM: "Kavach Appeals <appeals@reimaginy.tech>"
  _MAIL_REPLY_TO: appeals@reimaginy.tech
  _CLOUDFLARE_ACCOUNT_ID: 25440e45ad090dc826ef2f8a7a4f0a25
options:
  # Required when the trigger runs as a user-managed service account.
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA", "-f", "sombrero/Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=sombrero-run@$PROJECT_ID.iam.gserviceaccount.com
      # Public at the network level; the app checks Firebase tokens itself.
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      # Hearing rehearsals are WebSocket sessions; the 5-minute default would cut them off.
      - --timeout=3600
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,GCP_REGION=${_REGION},USE_VERTEX=true,DOCS_BUCKET=$PROJECT_ID-docs,MODEL_FAST=${_MODEL_FAST},MODEL_REASONING=${_MODEL_REASONING},RULINGS_ENGINE=kavach-rulings,PUBLIC_URL=${_PUBLIC_URL},PAYMENTS_ENABLED=${_PAYMENTS_ENABLED},WHATSAPP_VERIFY_TOKEN=${_WHATSAPP_VERIFY_TOKEN},WHATSAPP_PHONE_NUMBER_ID=${_WHATSAPP_PHONE_NUMBER_ID},WHATSAPP_TEMPLATE=${_WHATSAPP_TEMPLATE},MAIL_FROM=${_MAIL_FROM},MAIL_REPLY_TO=${_MAIL_REPLY_TO},CLOUDFLARE_ACCOUNT_ID=${_CLOUDFLARE_ACCOUNT_ID}
      # Secrets: Twilio's auth token signs webhooks; WhatsApp's app secret verifies Meta's
      # signature and its access token sends replies; Razorpay/Stripe keys take payments.
      - --update-secrets=TWILIO_ACCOUNT_SID=twilio-account-sid:latest,TWILIO_AUTH_TOKEN=twilio-auth-token:latest,WHATSAPP_ACCESS_TOKEN=whatsapp-access-token:latest,WHATSAPP_APP_SECRET=whatsapp-app-secret:latest,RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,CLOUDFLARE_EMAIL_TOKEN=cloudflare-email-token:latest,MAIL_INBOUND_TOKEN=mail-inbound-token:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
